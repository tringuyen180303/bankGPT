{% extends "base.html" %}
{% block title %}Core Console — Sign on{% endblock %}
{% block content %}
<div class="panel">
  <h1>Operator sign-on</h1>
  <div class="body">
    {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <table class="grid">
        <tr>
          <th><label for="username">Operator ID</label></th>
          <td><input id="username" name="username" type="text" autocomplete="username" /></td>
        </tr>
        <tr>
          <th><label for="password">Password</label></th>
          <td><input id="password" name="password" type="password" autocomplete="current-password" /></td>
        </tr>
      </table>
      <p><button type="submit">Sign on</button></p>
      <p><span>Demo: teller / demo</span></p>
    </form>
  </div>
</div>
{% endblock %}
